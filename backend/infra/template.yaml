# AWS SAM sketch of the LeaseThread backend (design only; not deployed or validated).
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Parameters:
  BedrockModelId: { Type: String }
Resources:
  LeaseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms } }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
  Api:
    Type: AWS::Serverless::HttpApi
    # Add Cognito JWT authorizer for /api/* except /api/leads
  TriageFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: triage.handler
      Runtime: nodejs20.x
      CodeUri: ../lambdas/
      Timeout: 30
      Environment: { Variables: { BEDROCK_MODEL_ID: !Ref BedrockModelId } }
      Policies: [{ Statement: [{ Effect: Allow, Action: bedrock:InvokeModel, Resource: '*' }] }]  # scope to the model ARN
      Events: { Post: { Type: HttpApi, Properties: { Path: /api/triage, Method: post, ApiId: !Ref Api } } }
  ExtractFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lease-extract.handler
      Runtime: nodejs20.x
      CodeUri: ../lambdas/
      Timeout: 300
      Events: { Upload: { Type: S3, Properties: { Bucket: !Ref LeaseBucket, Events: s3:ObjectCreated:* } } }
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref TriageFn }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
# Also needed: VPC + Aurora PostgreSQL (private subnets, RDS Proxy), Cognito user pool, Secrets Manager, EventBridge schedule for renewal scans.
